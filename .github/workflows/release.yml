name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxidebot-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test controller
        run: bash tests/controller_test.sh
      - name: Test template rendering
        run: bash tests/template_test.sh
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^versionName=//p' template.properties)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match template version v$version" >&2
            exit 1
          }

  binaries:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
          - i686-linux-android
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install 'ndk;29.0.14206865'
      - name: Build ${{ matrix.target }}
        run: >-
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          bash runner/scripts/build-android.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: oxidebot-binary-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1
          path: runner/target/${{ matrix.target }}/release/oxidebot_app

  manager:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Build Android manager
        working-directory: manager-app
        run: |
          ./gradlew assembleDebug
          version="$(sed -n 's/^versionName=//p' ../template.properties)"
          module_id="$(sed -n 's/^moduleId=//p' ../template.properties)"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${module_id}-manager-v${version}-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: oxidebot-manager
          if-no-files-found: error
          retention-days: 1
          path: manager-app/dist/*.apk

  module:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-binary-aarch64-linux-android
          path: runner/target/aarch64-linux-android/release
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-binary-armv7-linux-androideabi
          path: runner/target/armv7-linux-androideabi/release
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-binary-x86_64-linux-android
          path: runner/target/x86_64-linux-android/release
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-binary-i686-linux-android
          path: runner/target/i686-linux-android/release
      - name: Build module ZIP
        run: BINARY_DIR=runner/target bash build.sh
      - name: Verify module ZIP
        run: unzip -t build/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: oxidebot-module
          if-no-files-found: error
          retention-days: 1
          path: |
            build/*.zip
            build/update.json

  bundle:
    needs: [module, manager]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-module
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-manager
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: oxidebot-root
          if-no-files-found: error
          retention-days: 14
          path: dist/*

  release-manager:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Prepare Android release signing
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          OXIDEBOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OXIDEBOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OXIDEBOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_SIGNING_KEY_BASE64:?Configure ANDROID_SIGNING_KEY_BASE64 before tagging a release}"
          : "${OXIDEBOT_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD before tagging a release}"
          : "${OXIDEBOT_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS before tagging a release}"
          : "${OXIDEBOT_KEY_PASSWORD:?Configure ANDROID_KEY_PASSWORD before tagging a release}"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/oxidebot-release.jks"
      - name: Build signed Android manager
        working-directory: manager-app
        env:
          OXIDEBOT_KEYSTORE_FILE: ${{ runner.temp }}/oxidebot-release.jks
          OXIDEBOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OXIDEBOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OXIDEBOT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          version="$(sed -n 's/^versionName=//p' ../template.properties)"
          module_id="$(sed -n 's/^moduleId=//p' ../template.properties)"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${module_id}-manager-v${version}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: oxidebot-manager-release
          if-no-files-found: error
          retention-days: 1
          path: manager-app/dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [module, release-manager]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-module
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: oxidebot-manager-release
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
