name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxidebot-root-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test controller
        run: bash tests/controller_test.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install 'ndk;29.0.14206865'
      - name: Build OxideBot Android binaries
        run: |
          git clone --depth=1 https://github.com/canxin121/my_oxidebot ../my_oxidebot
          cd ../my_oxidebot
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.14206865" bash scripts/build-android.sh
      - name: Build module
        run: BINARY_DIR=../my_oxidebot/target bash build.sh
      - name: Build Android manager
        working-directory: manager-app
        run: |
          ./gradlew assembleDebug
          version="$(sed -n 's/^version=//p' ../module.prop)"
          cp app/build/outputs/apk/debug/app-debug.apk "../build/OxideBot-Manager-${version}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: oxidebot-root
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.zip
            build/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: oxidebot-root
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: dist/*
